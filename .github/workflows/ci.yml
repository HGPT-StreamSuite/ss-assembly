name: MRE verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
          python-version: "3.11"
      - run: uv sync --locked
      - run: uv run pytest -m "not integration"
      - run: uv run ss-assembly demo
      - run: uv build

  rabbitmq:
    runs-on: ubuntu-latest
    services:
      broker:
        image: rabbitmq:4.1.4-management
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.9.22"
          python-version: "3.11"
      - run: uv sync --locked --extra rabbitmq
      - run: uv run --extra rabbitmq pytest -m integration -v
        env:
          SS_MRE_TEST_AMQP_URL: amqp://guest:guest@127.0.0.1/
